name: build-dll

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x86
        run: msbuild ezorsia.sln /p:Configuration=Release /p:Platform=x86

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ijl15-release
          path: |
            out/Release/ijl15.dll
            ezorsia/config.ini

      - name: Package release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out/Release/ijl15.dll release/
          Copy-Item ezorsia/config.ini release/
          Compress-Archive -Path release/* -DestinationPath "ijl15-${{ github.ref_name }}.zip"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ijl15-${{ github.ref_name }}.zip
            out/Release/ijl15.dll
            ezorsia/config.ini
